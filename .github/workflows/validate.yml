name: validate

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  repository:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-analysis.txt

      - name: Install analysis dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-analysis.txt
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Parse PowerShell tools
        shell: pwsh
        run: |
          Get-ChildItem tools/autocheck/*.ps1 | ForEach-Object {
            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile(
              $_.FullName,
              [ref]$tokens,
              [ref]$errors
            )
            if ($errors.Count -gt 0) {
              throw ($errors | Format-List | Out-String)
            }
          }

      - name: Run autonomous repository gate
        run: >-
          python tools/autocheck/oz12_autocheck.py repo
          --outdir reports/autocheck/repository
